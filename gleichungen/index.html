<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>Gleichungen lösen</title>
<style>
:root{
  --bg:#f6f5f1;--card:#fff;--fg:#1e2226;--muted:#636a72;--line:#dcd8d0;
  --btn:#eef0f3;--btn-fg:#1e2226;--accent:#2d5b97;--accent-fg:#fff;
  --warn:#b45309;--ok:#1d7a3e;--ok-bg:#e7f4ec;--info-bg:#e9eef7;
  --wood:#e3b874;--head:#c43a2f;--box:#3c69a2;--box-strip:#7b5532;--box-fg:#fff;
  --scale:#59626d;--plate:#8b949e;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15171a;--card:#1e2125;--fg:#e7e5e1;--muted:#9aa1a8;--line:#33373d;
  --btn:#2a2e33;--btn-fg:#e7e5e1;--accent:#6c9ce0;--accent-fg:#10141a;
  --warn:#f0a35a;--ok:#5cc184;--ok-bg:#16301f;--info-bg:#1a2536;
  --wood:#d8aa62;--head:#e35a4d;--box:#4d7dbb;--box-strip:#9a6d43;--box-fg:#fff;
  --scale:#a0a8b2;--plate:#b9c0c8;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:1.15rem;margin:0}
.stufen{display:flex;gap:3px;background:var(--btn);border-radius:10px;padding:3px}
.stufen button{border:0;background:transparent;color:var(--fg);font:inherit;font-size:.95rem;padding:8px 12px;min-height:40px;border-radius:8px;cursor:pointer;touch-action:manipulation}
.stufen button[aria-pressed="true"]{background:var(--card);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.18)}
#auftrag{color:var(--muted);font-size:.95rem;margin:.5rem 0 .6rem}
.karte{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 8px}
svg{display:block;width:100%;height:auto}
.st{fill:var(--scale)}.bm{stroke:var(--scale);stroke-width:6;stroke-linecap:round}
.pf{stroke:var(--scale);stroke-width:4}.pv{fill:var(--card);stroke:var(--scale);stroke-width:3}
.pl{fill:var(--plate)}.nd{stroke:var(--accent);stroke-width:2.5;stroke-linecap:round}.mk{fill:var(--muted)}
.wd{fill:var(--wood)}.hd{fill:var(--head)}.bx{fill:var(--box)}.bx.ok{fill:var(--ok)}.bs{fill:var(--box-strip)}
.bt{fill:var(--box-fg);font:italic 600 13px Georgia,"Times New Roman",serif;text-anchor:middle}
var{font-style:italic;font-family:Georgia,"Times New Roman",serif}
.kette{display:flex;justify-content:center;margin-top:10px;overflow-x:auto}
.kette table{border-collapse:collapse;font-size:1.2rem;font-variant-numeric:tabular-nums}
body[data-stufe="3"] .kette table{font-size:1.35rem}
.kette td{padding:2px 4px;white-space:nowrap}
.kette .l{text-align:right}.kette .m{text-align:center;min-width:1.4em}.kette .r{text-align:left}
.kette .o{color:var(--muted);font-size:.9em;padding-left:14px}
.kette .o.bad{color:var(--warn)}
.kette tr.akt td:not(.o){font-weight:600}
.kette tr.live td{color:var(--warn);font-weight:600}
.kette tr.ok td:not(.o){color:var(--ok);font-weight:700}
#hinweis{min-height:1.4em;margin:8px 0;color:var(--warn);text-align:center;font-size:.95rem}
.kopf{font-size:.85rem;color:var(--muted);text-align:center;margin:0 0 6px}
.spalten{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spalte{display:grid;gap:8px;align-content:start}
.reihe{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.reihe5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px}
.reihe2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.op{min-height:48px;padding:6px 8px;border:1px solid var(--line);border-radius:12px;background:var(--btn);color:var(--btn-fg);font:inherit;font-size:1rem;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button.op:active:not(:disabled){transform:translateY(1px)}
button.op:disabled{opacity:.4;cursor:default}
button.primaer{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:600}
button.weit{width:100%}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center;margin-bottom:8px}
.stepper output{text-align:center;font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums}
.unten{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.banner{border-radius:12px;padding:12px;margin:10px 0;text-align:center}
.banner p{margin:0 0 10px}
.gut{background:var(--ok-bg)}.info{background:var(--info-bg)}
.gross{font-size:1.6rem;font-weight:700;color:var(--ok);margin-bottom:10px}
</style>
</head>
<body>
<main>
  <header>
    <h1>Gleichungen lösen</h1>
    <div class="stufen" role="group" aria-label="Stufe">
      <button type="button" data-stufe="1">Stufe 1</button>
      <button type="button" data-stufe="2">Stufe 2</button>
      <button type="button" data-stufe="3">Stufe 3</button>
    </div>
  </header>
  <p id="auftrag"></p>
  <div id="bild" class="karte"><svg id="waage" viewBox="0 40 360 156" role="img"></svg></div>
  <div id="kette" class="kette"></div>
  <p id="hinweis" role="status" aria-live="polite"></p>
  <div id="ziel" class="banner gut" hidden>
    <div class="gross"><var>x</var> = <span id="loesung"></span></div>
    <button type="button" class="op primaer weit" id="weiter">Nächste Aufgabe</button>
  </div>
  <div id="vorschlag" class="banner info" hidden>
    <p id="vtext"></p>
    <div class="reihe2"><button type="button" class="op primaer" id="vja"></button><button type="button" class="op" id="vnein">Hier bleiben</button></div>
  </div>
  <div id="steuer"></div>
  <div id="unten" class="unten">
    <button type="button" class="op" id="undo">Rückgängig</button>
    <button type="button" class="op" id="neu">Neue Aufgabe</button>
  </div>
</main>
<script>
(() => {
'use strict';

const KEY = 'aequi.stufe';
const M = '\u2212';
const X = '<var>x</var>';
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const clone = o => JSON.parse(JSON.stringify(o));
const SIDE = { L: 'Links', R: 'Rechts' };
const SIDE2 = { L: 'Linke Seite', R: 'Rechte Seite', B: 'Beide Seiten' };

const CFG = {
  1: { x: [2, 5], a: [1, 3], b: [0, 4], dMax: 10 },
  2: { x: [2, 6], a: [1, 4], b: [0, 6], dMax: 15 },
  3: { x: [2, 9], a: [2, 6], b: [0, 12], dMax: 40 }
};
const TEXT = {
  1: 'In jeder Schachtel stecken gleich viele Hölzer. Finde heraus, wie viele. Jeder Knopf wirkt nur auf eine Seite.',
  2: 'In jeder Schachtel stecken gleich viele Hölzer. Finde heraus, wie viele. Jeder Knopf wirkt auf beide Seiten.',
  3: 'Löse die Gleichung. Jede Umformung wirkt auf beide Seiten.'
};
const UNBAL = 'Die Waage ist nicht im Gleichgewicht.';

let stage = loadStage();
let S = null;
let note = '';
let picker = null;
let k3 = 2;
let streak = 0;
let suggest = false;
let lastKey = '';
let angle = 0;
let anim = 0;
const declined = { 1: false, 2: false };

function loadStage() {
  try { const v = parseInt(localStorage.getItem(KEY), 10); if (v >= 1 && v <= 3) return v; } catch (e) {}
  return 1;
}
function saveStage() {
  try { localStorage.setItem(KEY, String(stage)); } catch (e) {}
}

function makeTask() {
  const c = CFG[stage];
  for (let i = 0; i < 2000; i++) {
    const x = rnd(c.x[0], c.x[1]);
    const a = rnd(c.a[0], c.a[1]);
    const cc = rnd(0, a - 1);
    const b = rnd(c.b[0], c.b[1]);
    const d = (a - cc) * x + b;
    if (d > c.dMax) continue;
    if (a === 1 && cc === 0 && b === 0) continue;
    const swap = Math.random() < 0.5;
    const L = swap ? { x: cc, n: d } : { x: a, n: b };
    const R = swap ? { x: a, n: b } : { x: cc, n: d };
    const key = [L.x, L.n, R.x, R.n].join();
    if (key === lastKey) continue;
    lastKey = key;
    return { x, L, R };
  }
  return { x: 3, L: { x: 2, n: 1 }, R: { x: 0, n: 7 } };
}

function newTask() {
  const t = makeTask();
  S = {
    x: t.x, L: t.L, R: t.R,
    chain: [{ L: clone(t.L), R: clone(t.R), op: null }],
    pending: [], hist: [], usedUndo: false, hadBad: false, solved: false
  };
  picker = null;
  note = '';
  suggest = false;
  render(true);
}

const w = s => s.x * S.x + s.n;
function rel() {
  const d = w(S.L) - w(S.R);
  return d === 0 ? '=' : d < 0 ? '<' : '>';
}
const relHtml = r => r === '<' ? '&lt;' : r === '>' ? '&gt;' : '=';

function term(s) {
  const p = [];
  if (s.x) p.push((s.x === 1 ? '' : s.x) + X);
  if (s.n || !s.x) p.push(s.n);
  return p.join(' + ');
}
function opText(op) {
  if (!op) return '';
  switch (op.kind) {
    case 'subN': return '| ' + M + op.k;
    case 'subX': return '| ' + M + (op.k === 1 ? '' : op.k) + X;
    case 'sub': return '| ' + M + (op.x === 1 ? '' : op.x) + X + ' ' + M + ' ' + op.n;
    case 'div': return '| :' + op.k;
    case 'bad': return '| ?';
  }
  return '';
}
function desc(s) {
  const p = [];
  if (s.x) p.push(s.x + (s.x === 1 ? ' Schachtel' : ' Schachteln'));
  if (s.n) p.push(s.n + (s.n === 1 ? ' Holz' : ' Hölzer'));
  return p.length ? p.join(' und ') : 'nichts';
}

function canApply(s, kind, k) {
  if (kind === 'subN') return s.n >= k;
  if (kind === 'subX') return s.x >= k;
  return k >= 2 && s.x + s.n > 0 && s.x % k === 0 && s.n % k === 0;
}
function applyTo(s, kind, k) {
  if (kind === 'subN') s.n -= k;
  else if (kind === 'subX') s.x -= k;
  else { s.x /= k; s.n /= k; }
}
function failText(sd, kind, k) {
  const s = S[sd], who = SIDE[sd];
  if (stage < 3) {
    if (kind === 'subN') return who + ' liegt kein Holz mehr.';
    if (kind === 'subX') return who + ' liegt keine Schachtel mehr.';
    if (!s.x && !s.n) return who + ' liegt nichts mehr.';
    return who + ' lässt sich nicht in ' + k + ' gleiche Teile aufteilen.';
  }
  if (kind === 'subN') return who + ' ist zu wenig da, um ' + k + ' abzuziehen.';
  if (kind === 'subX') return who + ' sind zu wenige x da, um ' + (k === 1 ? '' : k) + 'x abzuziehen.';
  return who + ' lässt sich nicht ohne Bruch durch ' + k + ' teilen.';
}

function evalPending(p) {
  const divs = p.filter(o => o.kind === 'div');
  if (divs.length) {
    if (p.length === 2 && divs.length === 2 && p[0].side !== p[1].side && p[0].k === p[1].k) return { kind: 'div', k: p[0].k };
    return { kind: 'bad' };
  }
  const net = { L: { x: 0, n: 0 }, R: { x: 0, n: 0 } };
  for (const o of p) net[o.side][o.kind === 'subN' ? 'n' : 'x'] += o.k;
  if (net.L.x !== net.R.x || net.L.n !== net.R.n) return { kind: 'bad' };
  if (net.L.x && net.L.n) return { kind: 'sub', x: net.L.x, n: net.L.n };
  if (net.L.x) return { kind: 'subX', k: net.L.x };
  return { kind: 'subN', k: net.L.n };
}

function commit(op) {
  const ch = S.chain;
  const last = ch[ch.length - 1];
  const prev = ch[ch.length - 2];
  const merge = stage < 3 && prev && prev.op && prev.op.kind === op.kind && (op.kind === 'subN' || op.kind === 'subX');
  if (merge) {
    prev.op = { kind: op.kind, k: prev.op.k + op.k };
    last.L = clone(S.L);
    last.R = clone(S.R);
  } else {
    last.op = op;
    ch.push({ L: clone(S.L), R: clone(S.R), op: null });
  }
}

function snapshot() {
  return clone({ L: S.L, R: S.R, chain: S.chain, pending: S.pending });
}

function doOp(side, kind, k) {
  if (S.solved) return;
  const sides = side === 'B' ? ['L', 'R'] : [side];
  for (const sd of sides) {
    if (!canApply(S[sd], kind, k)) { note = failText(sd, kind, k); render(); return; }
  }
  S.hist.push(snapshot());
  for (const sd of sides) applyTo(S[sd], kind, k);
  note = '';
  if (side === 'B') {
    commit({ kind, k });
  } else {
    S.pending.push({ side, kind, k });
    if (rel() === '=') {
      const op = evalPending(S.pending);
      S.pending = [];
      if (op.kind === 'bad') {
        S.hadBad = true;
        note = 'Wieder im Gleichgewicht, aber links und rechts wurde nicht dasselbe gemacht.';
      }
      commit(op);
    } else {
      note = UNBAL;
    }
  }
  checkSolved();
  render();
}

function undo() {
  if (!S.hist.length || S.solved) return;
  const h = S.hist.pop();
  S.L = h.L; S.R = h.R; S.chain = h.chain; S.pending = h.pending;
  S.usedUndo = true;
  picker = null;
  note = S.pending.length ? UNBAL : '';
  render();
}

function isSolved() {
  if (S.pending.length || rel() !== '=') return false;
  const one = s => s.x === 1 && s.n === 0;
  const num = s => s.x === 0;
  return (one(S.L) && num(S.R)) || (one(S.R) && num(S.L));
}
function checkSolved() {
  if (!isSolved()) return;
  S.solved = true;
  const clean = stage === 1 ? !S.hadBad : !S.usedUndo;
  streak = clean ? streak + 1 : 0;
  if (stage < 3 && streak >= 3 && !declined[stage]) suggest = true;
}

function setStage(n) {
  if (n === stage) return;
  stage = n;
  saveStage();
  streak = 0;
  newTask();
}

/* Waage */
const P = { x: 180, y: 150 }, H = 95, POST = 26;

function stick(x, yb) {
  return `<rect x="${x - 1.6}" y="${yb - 24}" width="3.2" height="24" rx="1" class="wd"/>` +
         `<ellipse cx="${x}" cy="${yb - 24}" rx="2.6" ry="3.4" class="hd"/>`;
}
function box(x, y) {
  const lab = S.solved ? S.x : 'x';
  return `<rect x="${x}" y="${y}" width="30" height="20" rx="2" class="bx${S.solved ? ' ok' : ''}"/>` +
         `<rect x="${x}" y="${y}" width="30" height="4" class="bs"/>` +
         `<text x="${x + 15}" y="${y + 16}" class="bt">${lab}</text>`;
}
function objects(s, cx, yb) {
  let g = '', y = yb;
  if (s.x) {
    const tot = s.x * 30 + (s.x - 1) * 4;
    let x = cx - tot / 2;
    for (let i = 0; i < s.x; i++) { g += box(x, y - 20); x += 34; }
    y -= 22;
  }
  let left = s.n;
  while (left > 0) {
    const m = Math.min(15, left);
    const tot = (m - 1) * 8 + (Math.ceil(m / 5) - 1) * 5;
    let x = cx - tot / 2;
    for (let i = 0; i < m; i++) {
      if (i && i % 5 === 0) x += 5;
      g += stick(x, y);
      x += 8;
    }
    left -= m;
    y -= 30;
  }
  return g;
}
function drawScale() {
  const r = angle * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
  const Lx = P.x - H * c, Ly = P.y - H * s, Rx = P.x + H * c, Ry = P.y + H * s;
  const tipX = P.x + 44 * s, tipY = P.y - 44 * c;
  let g = '';
  g += `<path d="M${P.x} ${P.y} L${P.x - 26} ${P.y + 36} L${P.x + 26} ${P.y + 36} Z" class="st"/>`;
  g += `<rect x="${P.x - 60}" y="${P.y + 36}" width="120" height="6" rx="3" class="st"/>`;
  g += `<path d="M${P.x - 6} ${P.y - 54} L${P.x + 6} ${P.y - 54} L${P.x} ${P.y - 47} Z" class="mk"/>`;
  g += `<line x1="${P.x}" y1="${P.y}" x2="${tipX}" y2="${tipY}" class="nd"/>`;
  g += `<line x1="${Lx}" y1="${Ly}" x2="${Lx}" y2="${Ly - POST}" class="pf"/>`;
  g += `<line x1="${Rx}" y1="${Ry}" x2="${Rx}" y2="${Ry - POST}" class="pf"/>`;
  g += `<line x1="${Lx}" y1="${Ly}" x2="${Rx}" y2="${Ry}" class="bm"/>`;
  g += `<circle cx="${P.x}" cy="${P.y}" r="5" class="pv"/>`;
  g += `<rect x="${Lx - 75}" y="${Ly - POST - 3}" width="150" height="6" rx="3" class="pl"/>`;
  g += `<rect x="${Rx - 75}" y="${Ry - POST - 3}" width="150" height="6" rx="3" class="pl"/>`;
  g += objects(S.L, Lx, Ly - POST - 3) + objects(S.R, Rx, Ry - POST - 3);
  const svg = $('waage');
  svg.innerHTML = g;
  const r2 = rel();
  svg.setAttribute('aria-label', 'Waage. Links ' + desc(S.L) + ', rechts ' + desc(S.R) + '. ' +
    (r2 === '=' ? 'Gleichgewicht.' : r2 === '>' ? 'Links ist schwerer.' : 'Rechts ist schwerer.'));
}
function targetAngle() {
  const d = w(S.R) - w(S.L);
  return d ? Math.sign(d) * Math.min(12, 4 + 1.2 * Math.abs(d)) : 0;
}
function animateTo(t, instant) {
  cancelAnimationFrame(anim);
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (instant || reduce || t === angle) { angle = t; drawScale(); return; }
  const a0 = angle, t0 = performance.now(), dur = 380;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    angle = a0 + (t - a0) * (1 - Math.pow(1 - p, 3));
    drawScale();
    if (p < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}

/* Anzeige */
function row(cls, l, m, r, op) {
  const oc = 'o' + (op && op.kind === 'bad' ? ' bad' : '');
  return `<tr class="${cls}"><td class="l">${l}</td><td class="m">${relHtml(m)}</td><td class="r">${r}</td><td class="${oc}">${opText(op)}</td></tr>`;
}
function renderChain() {
  const rows = S.chain.map((ln, i) => {
    const last = i === S.chain.length - 1;
    const cls = last && !S.pending.length ? (S.solved ? 'ok' : 'akt') : '';
    return row(cls, term(ln.L), '=', term(ln.R), ln.op);
  });
  if (S.pending.length) rows.push(row('live', term(S.L), rel(), term(S.R), null));
  $('kette').innerHTML = '<table><tbody>' + rows.join('') + '</tbody></table>';
}
function btn(side, kind, label, extra) {
  return `<button type="button" class="op" data-side="${side}" data-kind="${kind}"${extra || ''}>${label}</button>`;
}
function renderControls() {
  const el = $('steuer');
  el.hidden = S.solved;
  if (S.solved) { el.innerHTML = ''; return; }
  if (picker) {
    const nums = [2, 3, 4, 5, 6].map(n => `<button type="button" class="op" data-div="${n}">${n}</button>`).join('');
    el.innerHTML = `<p class="kopf">${SIDE2[picker]} in gleiche Teile aufteilen. Ein Teil bleibt liegen. In wie viele?</p>` +
      `<div class="reihe5">${nums}</div><button type="button" class="op weit" data-cancel="1">Abbrechen</button>`;
    return;
  }
  if (stage === 1) {
    const col = s => `<div class="spalte"><p class="kopf">${SIDE[s]}</p>${btn(s, 'subN', M + ' 1 Holz')}${btn(s, 'subX', M + ' 1 Schachtel')}${btn(s, 'div', 'Teilen')}</div>`;
    el.innerHTML = `<div class="spalten">${col('L')}${col('R')}</div>`;
  } else if (stage === 2) {
    el.innerHTML = `<p class="kopf">Auf beiden Seiten</p><div class="reihe">${btn('B', 'subN', M + ' 1 Holz')}${btn('B', 'subX', M + ' 1 Schachtel')}${btn('B', 'div', 'Teilen')}</div>`;
  } else {
    el.innerHTML = `<div class="stepper"><button type="button" class="op" data-step="-1" aria-label="kleiner">‹</button>` +
      `<output>${k3}</output><button type="button" class="op" data-step="1" aria-label="größer">›</button></div>` +
      `<div class="reihe">${btn('B', 'subN', M + ' ' + k3)}${btn('B', 'subX', M + ' ' + (k3 === 1 ? '' : k3) + X)}${btn('B', 'div', ': ' + k3, k3 < 2 ? ' disabled' : '')}</div>`;
  }
}

function render(instant) {
  document.body.dataset.stufe = stage;
  document.querySelectorAll('.stufen button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.stufe === stage)));
  $('auftrag').textContent = TEXT[stage];
  $('bild').hidden = stage === 3;
  renderChain();
  $('hinweis').textContent = note;
  renderControls();
  $('ziel').hidden = !S.solved;
  $('loesung').textContent = S.x;
  $('vorschlag').hidden = !suggest;
  if (suggest) {
    $('vtext').textContent = 'Du hast drei Aufgaben hintereinander sauber gelöst. Weiter mit Stufe ' + (stage + 1) + '?';
    $('vja').textContent = 'Weiter mit Stufe ' + (stage + 1);
  }
  $('unten').hidden = S.solved;
  $('undo').disabled = !S.hist.length;
  if (stage < 3) animateTo(targetAngle(), instant);
}

/* Bedienung */
$('steuer').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  if (b.dataset.step) { k3 = Math.max(1, Math.min(20, k3 + Number(b.dataset.step))); render(); return; }
  if (b.dataset.cancel) { picker = null; render(); return; }
  if (b.dataset.div) { const sd = picker; picker = null; doOp(sd, 'div', Number(b.dataset.div)); return; }
  const kind = b.dataset.kind, side = b.dataset.side;
  if (!kind) return;
  if (kind === 'div' && stage < 3) { picker = side; render(); return; }
  doOp(side, kind, stage === 3 ? k3 : 1);
});
document.querySelector('.stufen').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) setStage(Number(b.dataset.stufe));
});
$('undo').addEventListener('click', undo);
$('neu').addEventListener('click', newTask);
$('weiter').addEventListener('click', newTask);
$('vja').addEventListener('click', () => setStage(stage + 1));
$('vnein').addEventListener('click', () => { declined[stage] = true; suggest = false; render(); });

newTask();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
</body>
</html>
